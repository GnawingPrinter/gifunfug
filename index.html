<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiled GIF Player</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Auto hide controls overlay when idle in fullscreen */
      .controls-overlay {
        transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
      }
      .idle-hidden {
        opacity: 0;
        visibility: hidden;
        cursor: none;
      }
      
      /* Multi-GIF Grid Container */
      #gridDisplayContainer {
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        justify-content: flex-start;
        width: 100%;
        min-h-screen: 100vh;
        height: 100%;
        overflow: hidden;
      }

      .gif-tile-item {
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        box-sizing: border-box;
      }

      .gif-tile-item img, .gif-tile-item canvas {
        width: 100%;
        height: auto;
        display: block;
        object-fit: contain;
      }
    </style>
    <!-- Embedded Self-Contained omggif Decoder (Zero External CDN Dependency) -->
    <script>
      (function(root) {
        // omggif v1.0.10 bundled inline
        function GifReader(buf) {
          var p = 0;
          if (buf[p++] !== 0x47 || buf[p++] !== 0x49 || buf[p++] !== 0x46 ||
              buf[p++] !== 0x38 || (buf[p++] !== 0x37 && buf[p-1] !== 0x39) ||
              buf[p++] !== 0x61) {
            throw new Error("Invalid GIF file format");
          }
          this.buf = buf;
          this.width = buf[p++] | (buf[p++] << 8);
          this.height = buf[p++] | (buf[p++] << 8);
          var pf0 = buf[p++];
          this.globalPaletteOffset = null;
          this.globalPaletteSize = null;
          if (pf0 & 0x80) {
            this.globalPaletteOffset = p;
            this.globalPaletteSize = 1 << ((pf0 & 0x07) + 1);
            p += this.globalPaletteSize * 3;
          }
          this.loopCount = null;
          this.frames = [];
          p += 2; // bg index & aspect ratio
          while (p < buf.length) {
            var blockId = buf[p++];
            if (blockId === 0x21) {
              var extId = buf[p++];
              if (extId === 0xF9) {
                var blockSize = buf[p++];
                var gceFlags = buf[p++];
                var delay = buf[p++] | (buf[p++] << 8);
                var transIdx = buf[p++];
                p++; // block terminator
                this._gce = {
                  disposal: (gceFlags >> 2) & 0x07,
                  delay: delay,
                  transIndex: (gceFlags & 0x01) ? transIdx : null
                };
              } else if (extId === 0xFF) {
                var appBlockSize = buf[p++];
                var appStr = "";
                for (var i = 0; i < appBlockSize; i++) appStr += String.fromCharCode(buf[p++]);
                if (appStr === "NETSCAPE2.0" || appStr === "ANIMEXTS1.0") {
                  p++; // sub-block length (3)
                  p++; // 1
                  this.loopCount = buf[p++] | (buf[p++] << 8);
                  p++; // sub-block terminator
                } else {
                  while (p < buf.length) {
                    var len = buf[p++];
                    if (len === 0) break;
                    p += len;
                  }
                }
              } else {
                while (p < buf.length) {
                  var subLen = buf[p++];
                  if (subLen === 0) break;
                  p += subLen;
                }
              }
            } else if (blockId === 0x2C) {
              var x = buf[p++] | (buf[p++] << 8);
              var y = buf[p++] | (buf[p++] << 8);
              var w = buf[p++] | (buf[p++] << 8);
              var h = buf[p++] | (buf[p++] << 8);
              var flags = buf[p++];
              var hasLct = (flags & 0x80) !== 0;
              var lctSize = hasLct ? (1 << ((flags & 0x07) + 1)) : 0;
              var lctOffset = hasLct ? p : null;
              p += lctSize * 3;
              var dataOffset = p;
              p++; // min code size
              while (p < buf.length) {
                var dLen = buf[p++];
                if (dLen === 0) break;
                p += dLen;
              }
              var gce = this._gce || { disposal: 0, delay: 0, transIndex: null };
              this._gce = null;
              this.frames.push({
                x: x, y: y, width: w, height: h,
                hasLct: hasLct, lctOffset: lctOffset, lctSize: lctSize,
                dataOffset: dataOffset, disposal: gce.disposal, delay: gce.delay,
                transIndex: gce.transIndex
              });
            } else if (blockId === 0x3B) {
              break; // Trailer
            }
          }
        }

        GifReader.prototype.numFrames = function() { return this.frames.length; };
        GifReader.prototype.frameInfo = function(frameIdx) { return this.frames[frameIdx]; };

        GifReader.prototype.decodeAndBlitFrameRGBA = function(frameIdx, pixels) {
          var frame = this.frames[frameIdx];
          var p = frame.dataOffset;
          var minCodeSize = this.buf[p++];
          var clearCode = 1 << minCodeSize;
          var eoiCode = clearCode + 1;
          var nextCode = eoiCode + 1;
          var curCodeSize = minCodeSize + 1;
          var codeMask = (1 << curCodeSize) - 1;

          var paletteOffset = frame.hasLct ? frame.lctOffset : this.globalPaletteOffset;
          var transIndex = frame.transIndex;
          var buf = this.buf;

          var stack = new Uint16Array(4096);
          var suffix = new Uint8Array(4096);
          var prefix = new Uint16Array(4096);

          for (var i = 0; i < clearCode; i++) suffix[i] = i;

          var subBlockLen = buf[p++];
          var subBlockEnd = p + subBlockLen;
          var bitBuf = 0, bitLen = 0;
          var top = 0, prevCode = null;

          var x = frame.x, y = frame.y;
          var fw = frame.width, fh = frame.height;
          var canvasWidth = this.width;

          while (true) {
            while (bitLen < curCodeSize) {
              if (p >= subBlockEnd) {
                if (subBlockLen === 0) break;
                subBlockLen = buf[p++];
                subBlockEnd = p + subBlockLen;
                if (subBlockLen === 0) break;
              }
              bitBuf |= (buf[p++] << bitLen);
              bitLen += 8;
            }
            if (bitLen < curCodeSize) break;

            var code = bitBuf & codeMask;
            bitBuf >>= curCodeSize;
            bitLen -= curCodeSize;

            if (code === clearCode) {
              curCodeSize = minCodeSize + 1;
              codeMask = (1 << curCodeSize) - 1;
              nextCode = eoiCode + 1;
              prevCode = null;
              continue;
            }
            if (code === eoiCode) break;

            var inCode = code;
            if (code >= nextCode) {
              stack[top++] = prevCode === null ? 0 : prevCode;
              code = prevCode;
            }

            while (code >= clearCode) {
              stack[top++] = suffix[code];
              code = prefix[code];
            }
            stack[top++] = code;

            if (prevCode !== null && nextCode < 4096) {
              prefix[nextCode] = prevCode;
              suffix[nextCode] = code;
              nextCode++;
              if ((nextCode & codeMask) === 0 && nextCode < 4096) {
                curCodeSize++;
                codeMask = (1 << curCodeSize) - 1;
              }
            }
            prevCode = inCode;

            while (top > 0) {
              var idx = stack[--top];
              if (idx !== transIndex && paletteOffset !== null) {
                var palIdx = paletteOffset + idx * 3;
                var pxIdx = ((y * canvasWidth) + x) * 4;
                pixels[pxIdx]   = buf[palIdx];
                pixels[pxIdx + 1] = buf[palIdx + 1];
                pixels[pxIdx + 2] = buf[palIdx + 2];
                pixels[pxIdx + 3] = 255;
              }
              x++;
              if (x >= frame.x + fw) {
                x = frame.x;
                y++;
                if (y >= frame.y + fh) break;
              }
            }
          }
        };

        root.omggif = { GifReader: GifReader };
      })(typeof window !== 'undefined' ? window : this);
    </script>
    <!-- Lucide Icons Library with graceful fallback handling -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  </head>
  <body class="h-full flex flex-col justify-between overflow-x-hidden bg-slate-950 text-slate-100">

    <!-- MAIN CONFIGURATION VIEW (Non-Fullscreen Hub) -->
    <main id="configView" class="min-h-screen flex flex-col justify-center items-center p-4 sm:p-6 lg:p-8 relative">
      
      <!-- Background Ambient Glow -->
      <div class="absolute inset-0 overflow-hidden pointer-events-none -z-10">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
        <div class="absolute top-1/2 -right-40 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 left-1/2 -translate-x-1/2 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl"></div>
      </div>

      <div class="w-full max-w-xl bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl relative">
        
        <!-- Header -->
        <div class="flex items-center space-x-3 mb-6">
          <div class="p-3 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-2xl shadow-lg shadow-indigo-500/30">
            <i data-lucide="grid" class="w-6 h-6 text-white"></i>
          </div>
          <div>
            <h1 class="text-2xl font-bold bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
              Tiled GIF Player
            </h1>
            <p class="text-xs text-slate-400">Tile GIFs into a full-screen repeating pattern grid with BPM sync</p>
          </div>
        </div>

        <!-- Input Form -->
        <form id="gifForm" onsubmit="event.preventDefault(); launchFullscreen();" class="space-y-4">
          
          <!-- Master Tap Tempo Sync Controller (Top of List) -->
          <div class="bg-slate-950/80 border border-slate-800 p-3 rounded-2xl flex items-center justify-between">
            <div>
              <span class="block text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Master BPM / Tap Sync</span>
              <span id="globalBpmDisplay" class="text-xs font-mono text-indigo-400">1.00s (60 BPM)</span>
            </div>
            <button 
              type="button" 
              id="masterTapBtn"
              onclick="handleTapTempo(event)" 
              class="px-4 py-2 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white text-xs font-bold uppercase tracking-wider rounded-xl shadow-lg shadow-indigo-500/20 active:scale-95 transition"
            >
              TAP TEMPO
            </button>
          </div>

          <div>
            <div class="flex items-center justify-between mb-2">
              <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">
                GIF List
              </label>
              <button 
                type="button" 
                onclick="addGifInput()" 
                class="inline-flex items-center space-x-1 px-2.5 py-1 text-xs font-semibold text-indigo-400 hover:text-white bg-indigo-500/10 hover:bg-indigo-600 rounded-lg transition"
              >
                <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                <span>Add GIF</span>
              </button>
            </div>

            <!-- List of GIF items -->
            <div id="gifListContainer" class="space-y-2.5 max-h-52 overflow-y-auto pr-1">
              <!-- Rendered via JS -->
            </div>
          </div>

          <!-- Compact Preview Card -->
          <div class="pt-1">
            <div 
              id="previewContainer" 
              class="relative w-full h-20 rounded-xl border border-slate-800 overflow-hidden flex items-center justify-center transition-all shadow-inner"
              style="background-color: #000000;"
            >
              <!-- Live Preview Tile Grid -->
              <div 
                id="previewTileBg" 
                class="absolute inset-0 w-full h-full flex flex-wrap content-start items-start transition-all overflow-hidden"
              ></div>
              
              <!-- Badge -->
              <div class="absolute bottom-1.5 right-2 bg-slate-900/90 backdrop-blur-md px-2 py-0.5 rounded border border-slate-700/50 text-[9px] text-slate-400 font-mono pointer-events-none">
                Preview Grid
              </div>
            </div>
          </div>

          <!-- Tile Size & Background Settings -->
          <div class="space-y-4 pt-2">
            
            <!-- Size Mode Toggle Tabs -->
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
                Sizing Mode
              </label>
              <div class="grid grid-cols-2 gap-1 p-1 bg-slate-950 border border-slate-800 rounded-2xl">
                <button 
                  type="button" 
                  id="modePixelsBtn"
                  onclick="setSizingMode('pixels')" 
                  class="py-2 px-3 text-xs font-medium rounded-xl transition-all duration-150 text-white bg-indigo-600 shadow-sm"
                >
                  Fixed Pixels
                </button>
                <button 
                  type="button" 
                  id="modeRepeatsBtn"
                  onclick="setSizingMode('repeats')" 
                  class="py-2 px-3 text-xs font-medium rounded-xl transition-all duration-150 text-slate-400 hover:text-white"
                >
                  Horizontal Repeats
                </button>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <!-- Dynamic Slider Container -->
              <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
                  <span id="sliderLabel">Tile Size:</span> <span id="tileSizeVal" class="text-indigo-400 font-mono">200px</span>
                </label>
                <div class="flex items-center bg-slate-950 px-4 py-2.5 border border-slate-800 rounded-2xl h-[46px]">
                  <input 
                    type="range" 
                    id="sizeSlider" 
                    min="50" 
                    max="600" 
                    step="10" 
                    value="200" 
                    oninput="handleSliderInput(this.value)"
                    class="w-full accent-indigo-500 cursor-pointer"
                  >
                </div>
              </div>

              <!-- Viewport mode filler column space -->
              <div id="sizingSecondaryInfo" class="flex flex-col justify-end">
                <div class="text-[11px] text-slate-500 bg-slate-950/50 p-2.5 rounded-2xl border border-slate-800/80 h-[46px] flex items-center justify-center text-center">
                  <span>Empty URL inputs produce solid color tiles.</span>
                </div>
              </div>
            </div>

            <!-- Background Color Mode Settings -->
            <div class="space-y-3 pt-2 border-t border-slate-800/60">
              <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">
                Background Mode
              </label>

              <!-- Mode Tabs -->
              <div class="grid grid-cols-3 gap-1 p-1 bg-slate-950 border border-slate-800 rounded-2xl">
                <button 
                  type="button" 
                  id="bgTabStatic" 
                  onclick="setBgMode('static')" 
                  class="py-1.5 px-2 text-[11px] font-medium rounded-xl transition-all text-white bg-indigo-600 shadow-sm"
                >
                  Static
                </button>
                <button 
                  type="button" 
                  id="bgTabRainbow" 
                  onclick="setBgMode('rainbow')" 
                  class="py-1.5 px-2 text-[11px] font-medium rounded-xl transition-all text-slate-400 hover:text-white"
                >
                  Rainbow Fade
                </button>
                <button 
                  type="button" 
                  id="bgTabList" 
                  onclick="setBgMode('list')" 
                  class="py-1.5 px-2 text-[11px] font-medium rounded-xl transition-all text-slate-400 hover:text-white"
                >
                  Color List (Tap)
                </button>
              </div>

              <!-- Mode 1: Static Color Picker -->
              <div id="bgConfigStatic" class="flex items-center space-x-3 bg-slate-950 p-2 border border-slate-800 rounded-2xl">
                <input type="color" id="bgColor" value="#000000" onchange="updateBgColor(this.value)" class="w-8 h-8 rounded-xl bg-transparent cursor-pointer border-0">
                <span id="bgColorHex" class="text-xs font-mono text-slate-300">#000000</span>
              </div>

              <!-- Mode 2: Rainbow Fade Settings -->
              <div id="bgConfigRainbow" class="hidden space-y-2 bg-slate-950 p-3 border border-slate-800 rounded-2xl">
                <div class="flex items-center justify-between">
                  <span class="text-xs text-slate-400">Cycle Speed:</span>
                  <span id="rainbowSpeedVal" class="text-xs font-mono text-indigo-400">5s</span>
                </div>
                <input 
                  type="range" 
                  id="rainbowSpeedSlider" 
                  min="1" 
                  max="20" 
                  step="0.5" 
                  value="5" 
                  oninput="updateRainbowSpeed(this.value)" 
                  class="w-full accent-indigo-500 cursor-pointer"
                >
              </div>

              <!-- Mode 3: Color List Controls -->
              <div id="bgConfigList" class="hidden space-y-3 bg-slate-950 p-3 border border-slate-800 rounded-2xl">
                <div class="flex items-center justify-between">
                  <label
