<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiled GIF Viewer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      /* Auto hide controls overlay when idle in fullscreen */
      .controls-overlay {
        transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
      }
      .idle-hidden {
        opacity: 0;
        visibility: hidden;
        cursor: none;
      }
      
      /* Multi-GIF Grid Container */
      #gridDisplayContainer {
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        justify-content: flex-start;
        width: 100%;
        min-h-screen: 100vh;
        height: 100%;
        overflow: hidden;
      }

      .gif-tile-item {
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        box-sizing: border-box;
      }

      .gif-tile-item img {
        width: 100%;
        height: auto;
        display: block;
        object-fit: contain;
      }
    </style>
  </head>
  <body class="h-full flex flex-col justify-between overflow-x-hidden">

    <!-- MAIN CONFIGURATION VIEW (Non-Fullscreen Hub) -->
    <main id="configView" class="min-h-screen flex flex-col justify-center items-center p-4 sm:p-6 lg:p-8 relative">
      
      <!-- Background Ambient Glow -->
      <div class="absolute inset-0 overflow-hidden pointer-events-none -z-10">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
        <div class="absolute top-1/2 -right-40 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 left-1/2 -translate-x-1/2 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl"></div>
      </div>

      <div class="w-full max-w-xl bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl relative">
        
        <!-- Header -->
        <div class="flex items-center space-x-3 mb-6">
          <div class="p-3 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-2xl shadow-lg shadow-indigo-500/30">
            <i data-lucide="grid" class="w-6 h-6 text-white"></i>
          </div>
          <div>
            <h1 class="text-2xl font-bold bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
              Tiled GIF Player
            </h1>
            <p class="text-xs text-slate-400">Tile GIFs into a full-screen repeating pattern grid</p>
          </div>
        </div>

        <!-- Input Form -->
        <form id="gifForm" onsubmit="event.preventDefault(); launchFullscreen();" class="space-y-4">
          <div>
            <div class="flex items-center justify-between mb-2">
              <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">
                GIF List
              </label>
              <button 
                type="button" 
                onclick="addGifInput()" 
                class="inline-flex items-center space-x-1 px-2.5 py-1 text-xs font-semibold text-indigo-400 hover:text-white bg-indigo-500/10 hover:bg-indigo-600 rounded-lg transition"
              >
                <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                <span>Add GIF</span>
              </button>
            </div>

            <!-- List of GIF URLs -->
            <div id="gifListContainer" class="space-y-2 max-h-48 overflow-y-auto pr-1">
              <!-- Rendered via JS -->
            </div>
          </div>

          <!-- Compact Preview Card (Visually integrated below input line) -->
          <div class="pt-1">
            <div 
              id="previewContainer" 
              class="relative w-full h-20 rounded-xl border border-slate-800 overflow-hidden flex items-center justify-center transition-all shadow-inner"
              style="background-color: #000000;"
            >
              <!-- Live Preview Tile Grid -->
              <div 
                id="previewTileBg" 
                class="absolute inset-0 w-full h-full flex flex-wrap content-start items-start transition-all overflow-hidden"
              ></div>
              
              <!-- Badge -->
              <div class="absolute bottom-1.5 right-2 bg-slate-900/90 backdrop-blur-md px-2 py-0.5 rounded border border-slate-700/50 text-[9px] text-slate-400 font-mono pointer-events-none">
                Preview Grid
              </div>
            </div>
          </div>

          <!-- Tile Size & Background Settings -->
          <div class="space-y-4 pt-2">
            
            <!-- Size Mode Toggle Tabs -->
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
                Sizing Mode
              </label>
              <div class="grid grid-cols-2 gap-1 p-1 bg-slate-950 border border-slate-800 rounded-2xl">
                <button 
                  type="button" 
                  id="modePixelsBtn"
                  onclick="setSizingMode('pixels')" 
                  class="py-2 px-3 text-xs font-medium rounded-xl transition-all duration-150 text-white bg-indigo-600 shadow-sm"
                >
                  Fixed Pixels
                </button>
                <button 
                  type="button" 
                  id="modeRepeatsBtn"
                  onclick="setSizingMode('repeats')" 
                  class="py-2 px-3 text-xs font-medium rounded-xl transition-all duration-150 text-slate-400 hover:text-white"
                >
                  Horizontal Repeats
                </button>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <!-- Dynamic Slider Container -->
              <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
                  <span id="sliderLabel">Tile Size:</span> <span id="tileSizeVal" class="text-indigo-400 font-mono">200px</span>
                </label>
                <div class="flex items-center bg-slate-950 px-4 py-2.5 border border-slate-800 rounded-2xl h-[46px]">
                  <input 
                    type="range" 
                    id="sizeSlider" 
                    min="50" 
                    max="600" 
                    step="10" 
                    value="200" 
                    oninput="handleSliderInput(this.value)"
                    class="w-full accent-indigo-500 cursor-pointer"
                  >
                </div>
              </div>

              <!-- Background Color Selection -->
              <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
                  Background Color
                </label>
                <div class="flex items-center space-x-2 bg-slate-950 p-1.5 border border-slate-800 rounded-2xl h-[46px]">
                  <input type="color" id="bgColor" value="#000000" onchange="updateBgColor(this.value)" class="w-8 h-8 rounded-xl bg-transparent cursor-pointer border-0">
                  <span id="bgColorHex" class="text-xs font-mono text-slate-300">#000000</span>
                </div>
              </div>
            </div>

          </div>

          <!-- Launch Button -->
          <button 
            type="submit" 
            class="w-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 hover:opacity-95 text-white font-semibold py-4 rounded-2xl transition-all duration-200 flex items-center justify-center space-x-2 shadow-lg shadow-indigo-500/25 active:scale-[0.99]"
          >
            <i data-lucide="expand" class="w-5 h-5"></i>
            <span>Launch Tiled Fullscreen View</span>
          </button>
        </form>

      </div>
    </main>

    <!-- FULLSCREEN DISPLAY CONTAINER -->
    <div 
      id="fullscreenContainer" 
      class="fixed inset-0 w-full h-full bg-black z-50 hidden select-none overflow-y-auto"
    >
      <!-- Dynamic Tiled Grid Layer -->
      <div id="gridDisplayContainer"></div>

      <!-- Floating HUD Overlay Controls -->
      <div 
        id="controlsOverlay" 
        class="controls-overlay absolute top-6 right-6 flex items-center space-x-3 bg-slate-900/80 backdrop-blur-md border border-slate-700/50 p-2 rounded-2xl shadow-2xl z-50"
      >
        <!-- Exit Fullscreen Button -->
        <button 
          type="button" 
          onclick="exitFullscreen()" 
          title="Exit Fullscreen View (Esc)"
          class="p-2.5 bg-rose-600/80 hover:bg-rose-600 text-white rounded-xl transition flex items-center space-x-2 text-xs font-medium shadow-md"
        >
          <i data-lucide="x" class="w-4 h-4"></i>
          <span>Exit</span>
        </button>
      </div>

      <!-- Quick Tooltip Guide -->
      <div 
        id="hintOverlay" 
        class="controls-overlay absolute bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/80 backdrop-blur-md text-slate-300 border border-slate-700/50 px-4 py-2 rounded-full text-xs font-medium shadow-lg pointer-events-none flex items-center space-x-2 z-50"
      >
        <i data-lucide="info" class="w-3.5 h-3.5 text-indigo-400"></i>
        <span>Press <kbd class="px-1.5 py-0.5 bg-slate-800 rounded border border-slate-700 text-white font-mono text-[10px]">ESC</kbd> or double-click anywhere to exit</span>
      </div>
    </div>

    <script>
      // State variables
      let sizingMode = 'pixels'; // 'pixels' or 'repeats'
      let pixelSize = 200;
      let repeatCount = 5;
      let computedTileSize = 200;
      let idleTimer = null;
      const IDLE_TIMEOUT = 3000;

      // GIF URL List state
      let gifUrls = ["https://media.tenor.com/390VTlJCoWYAAAAC/tenor.gif"];

      // Initialize Lucide Icons & Initial View
      window.onload = () => {
        renderGifInputs();
        lucide.createIcons();
        updatePreview();
      };

      // Dynamic Input List Management
      function renderGifInputs() {
        const container = document.getElementById('gifListContainer');
        container.innerHTML = '';

        gifUrls.forEach((url, index) => {
          const item = document.createElement('div');
          item.className = "flex items-center space-x-2";
          
          const wrapper = document.createElement('div');
          wrapper.className = "relative flex-1";

          const input = document.createElement('input');
          input.type = "url";
          input.placeholder = "https://media.giphy.com/media/.../giphy.gif";
          input.required = true;
          input.value = url;
          input.className = "w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 rounded-xl py-2 pl-3 pr-9 text-slate-100 placeholder-slate-500 transition-all outline-none text-xs";
          
          input.addEventListener('input', (e) => {
            gifUrls[index] = e.target.value.trim();
            updatePreview();
          });

          const pasteBtn = document.createElement('button');
          pasteBtn.type = "button";
          pasteBtn.title = "Paste from clipboard";
          pasteBtn.className = "absolute right-1.5 top-1/2 -translate-y-1/2 p-1 text-slate-400 hover:text-slate-200 rounded-lg transition";
          pasteBtn.innerHTML = `<i data-lucide="clipboard" class="w-3.5 h-3.5"></i>`;
          pasteBtn.onclick = () => pasteClipboardTo(index);

          wrapper.appendChild(input);
          wrapper.appendChild(pasteBtn);
          item.appendChild(wrapper);

          if (gifUrls.length > 1) {
            const removeBtn = document.createElement('button');
            removeBtn.type = "button";
            removeBtn.title = "Remove GIF";
            removeBtn.className = "p-2 text-slate-400 hover:text-rose-400 hover:bg-slate-800/60 rounded-xl transition";
            removeBtn.innerHTML = `<i data-lucide="trash-2" class="w-4 h-4"></i>`;
            removeBtn.onclick = () => removeGifInput(index);
            item.appendChild(removeBtn);
          }

          container.appendChild(item);
        });

        lucide.createIcons();
      }

      function addGifInput() {
        gifUrls.push('');
        renderGifInputs();
      }

      function removeGifInput(index) {
        if (gifUrls.length > 1) {
          gifUrls.splice(index, 1);
          renderGifInputs();
          updatePreview();
        }
      }

      async function pasteClipboardTo(index) {
        try {
          const text = await navigator.clipboard.readText();
          if (text) {
            gifUrls[index] = text.trim();
            renderGifInputs();
            updatePreview();
          }
        } catch (err) {
          console.warn('Clipboard read error:', err);
        }
      }

      // Toggle sizing mode between Fixed Pixels and Horizontal Repeats
      function setSizingMode(mode) {
        sizingMode = mode;
        const pixelsBtn = document.getElementById('modePixelsBtn');
        const repeatsBtn = document.getElementById('modeRepeatsBtn');
        const slider = document.getElementById('sizeSlider');
        const label = document.getElementById('sliderLabel');

        if (mode === 'pixels') {
          pixelsBtn.className = "py-2 px-3 text-xs font-medium rounded-xl transition-all duration-150 text-white bg-indigo-600 shadow-sm";
          repeatsBtn.className = "py-2 px-3 text-xs font-medium rounded-xl transition-all duration-150 text-slate-400 hover:text-white";
          label.textContent = "Tile Size:";
          slider.min = "50";
          slider.max = "600";
          slider.step = "10";
          slider.value = pixelSize;
          updateDisplayValue(pixelSize);
        } else {
          repeatsBtn.className = "py-2 px-3 text-xs font-medium rounded-xl transition-all duration-150 text-white bg-indigo-600 shadow-sm";
          pixelsBtn.className = "py-2 px-3 text-xs font-medium rounded-xl transition-all duration-150 text-slate-400 hover:text-white";
          label.textContent = "Horizontal Repeats:";
          slider.min = "1";
          slider.max = "30";
          slider.step = "1";
          slider.value = repeatCount;
          updateDisplayValue(repeatCount);
        }
      }

      // Slider input handler
      function handleSliderInput(val) {
        if (sizingMode === 'pixels') {
          pixelSize = parseInt(val, 10);
        } else {
          repeatCount = parseInt(val, 10);
        }
        updateDisplayValue(val);
      }

      // Calculate the active tile size in pixels
      function getActiveTileSize() {
        if (sizingMode === 'pixels') {
          return pixelSize;
        } else {
          return window.innerWidth / repeatCount;
        }
      }

      // Helper to update visual display text
      function updateDisplayValue(val) {
        computedTileSize = getActiveTileSize();
        if (sizingMode === 'pixels') {
          document.getElementById('tileSizeVal').textContent = `${val}px`;
        } else {
          document.getElementById('tileSizeVal').textContent = `${val} tiles (${Math.round(computedTileSize)}px each)`;
        }
        updatePreview();
      }

      // Update compact live preview box
      function updatePreview() {
        const previewBg = document.getElementById('previewTileBg');
        const previewContainer = document.getElementById('previewContainer');
        const bgColor = document.getElementById('bgColor').value;

        if (previewContainer) {
          previewContainer.style.backgroundColor = bgColor;
        }

        if (!previewBg) return;

        previewBg.innerHTML = '';
        const validUrls = gifUrls.filter(u => u.trim() !== '');
        if (validUrls.length === 0) return;

        // Preview tile size calculation
        let previewTileWidth;
        if (sizingMode === 'pixels') {
          previewTileWidth = Math.max(25, pixelSize * 0.25);
        } else {
          const previewContainerWidth = previewContainer?.offsetWidth || 500;
          previewTileWidth = Math.max(15, previewContainerWidth / repeatCount);
        }

        // Render mini grid for preview (up to 24 tiles max for performance)
        for (let i = 0; i < 24; i++) {
          const url = validUrls[i % validUrls.length];
          const tile = document.createElement('div');
          tile.className = "gif-tile-item";
          tile.style.width = `${previewTileWidth}px`;
          tile.style.backgroundColor = bgColor;
          
          const img = document.createElement('img');
          img.src = url;
          img.alt = "";
          
          tile.appendChild(img);
          previewBg.appendChild(tile);
        }
      }

      // Render Fullscreen Grid Items
      function renderFullscreenGrid() {
        const gridContainer = document.getElementById('gridDisplayContainer');
        const bgColor = document.getElementById('bgColor').value;
        gridContainer.innerHTML = '';

        const validUrls = gifUrls.filter(u => u.trim() !== '');
        if (validUrls.length === 0) return;

        computedTileSize = getActiveTileSize();
        
        // Estimate total items needed to fill viewport screen height with buffer
        const rowsNeeded = Math.ceil(window.innerHeight / (computedTileSize * 0.75)) + 4;
        const colsPerRow = sizingMode === 'repeats' ? repeatCount : Math.ceil(window.innerWidth / computedTileSize) + 1;
        const totalTiles = rowsNeeded * colsPerRow;

        for (let i = 0; i < totalTiles; i++) {
          const url = validUrls[i % validUrls.length];
          const tile = document.createElement('div');
          tile.className = "gif-tile-item";
          tile.style.width = `${computedTileSize}px`;
          tile.style.backgroundColor = bgColor;

          const img = document.createElement('img');
          img.src = url;
          img.alt = "";

          tile.appendChild(img);
          gridContainer.appendChild(tile);
        }
      }

      // Recalculate dynamic repeat size when window resizes
      window.addEventListener('resize', () => {
        if (sizingMode === 'repeats') {
          updateDisplayValue(repeatCount);
        } else {
          updatePreview();
        }

        const container = document.getElementById('fullscreenContainer');
        if (!container.classList.contains('hidden')) {
          renderFullscreenGrid();
        }
      });

      // Sync custom background color
      function updateBgColor(color) {
        document.getElementById('bgColorHex').textContent = color;
        document.getElementById('fullscreenContainer').style.backgroundColor = color;
        updatePreview();
      }

      // Launch Fullscreen mode with requestFullscreen API
      async function launchFullscreen() {
        const validUrls = gifUrls.filter(u => u.trim() !== '');
        if (validUrls.length === 0) return;

        const container = document.getElementById('fullscreenContainer');
        renderFullscreenGrid();
        container.classList.remove('hidden');

        // Request native Fullscreen if supported
        try {
          if (container.requestFullscreen) {
            await container.requestFullscreen();
          } else if (container.webkitRequestFullscreen) {
            await container.webkitRequestFullscreen();
          } else if (container.msRequestFullscreen) {
            await container.msRequestFullscreen();
          }
        } catch (e) {
          console.warn('Native Fullscreen denied or unsupported.', e);
        }

        setTimeout(() => {
          renderFullscreenGrid();
        }, 100);

        startIdleListener();
      }

      // Exit Fullscreen Mode
      function exitFullscreen() {
        const container = document.getElementById('fullscreenContainer');
        container.classList.add('hidden');
        document.getElementById('gridDisplayContainer').innerHTML = '';

        stopIdleListener();

        try {
          const fullscreenEl = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
          
          if (fullscreenEl && document.fullscreenEnabled !== false) {
            if (document.exitFullscreen) {
              document.exitFullscreen().catch(err => {
                console.warn('Unhandled exitFullscreen promise rejection:', err);
              });
            } else if (document.webkitExitFullscreen) {
              document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) {
              document.msExitFullscreen();
            }
          }
        } catch (err) {
          console.warn('Unable to exit native fullscreen:', err);
        }
      }

      document.addEventListener('fullscreenchange', handleFullscreenChange);
      document.addEventListener('webkitfullscreenchange', handleFullscreenChange);

      function handleFullscreenChange() {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          const container = document.getElementById('fullscreenContainer');
          if (!container.classList.contains('hidden')) {
            exitFullscreen();
          }
        }
      }

      document.getElementById('fullscreenContainer').addEventListener('dblclick', (e) => {
        if (!e.target.closest('#controlsOverlay')) {
          exitFullscreen();
        }
      });

      function resetIdleTimer() {
        const overlays = document.querySelectorAll('.controls-overlay');
        overlays.forEach(el => el.classList.remove('idle-hidden'));

        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
          overlays.forEach(el => el.classList.add('idle-hidden'));
        }, IDLE_TIMEOUT);
      }

      function startIdleListener() {
        const container = document.getElementById('fullscreenContainer');
        container.addEventListener('mousemove', resetIdleTimer);
        container.addEventListener('touchstart', resetIdleTimer);
        resetIdleTimer();
      }

      function stopIdleListener() {
        const container = document.getElementById('fullscreenContainer');
        container.removeEventListener('mousemove', resetIdleTimer);
        container.removeEventListener('touchstart', resetIdleTimer);
        clearTimeout(idleTimer);
        
        const overlays = document.querySelectorAll('.controls-overlay');
        overlays.forEach(el => el.classList.remove('idle-hidden'));
      }
    </script>
  </body>
</html>
